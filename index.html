<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử Thách Toán THCS</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Thư viện KaTeX tự động chuyển $...$ thành công thức toán -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        /* Tối ưu kích thước công thức toán cho vừa vặn với giao diện */
        .katex {
            font-size: 1.05em;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Card container chính -->
    <div class="max-w-4xl w-full bg-[#131b2e] rounded-2xl p-6 sm:p-8 shadow-2xl border border-slate-800/80">
        
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-wide">Thử Thách Toán THCS</h1>
                <p class="text-slate-400 text-sm mt-1">Ôn tập kiến thức Toán Lớp 6 - 9 qua câu hỏi trắc nghiệm</p>
            </div>
            <div class="inline-flex items-center gap-1.5 bg-[#251d10] text-[#f59e0b] border border-[#d97706]/40 text-xs font-semibold px-3 py-1.5 rounded-full">
                <span>🏆</span>
                <span>Cấp độ: THCS</span>
            </div>
        </div>

        <!-- Khung câu hỏi -->
        <div class="bg-[#182238] rounded-xl p-6 border border-slate-700/50">
            <div class="flex justify-between items-center mb-6">
                <span id="grade-badge" class="bg-[#1e3a8a]/60 text-[#60a5fa] border border-[#3b82f6]/30 text-xs px-3 py-1 rounded-md font-semibold">
                    Lớp 8
                </span>
                <span id="question-tracker" class="text-slate-400 text-sm font-medium">
                    Câu 1/3
                </span>
            </div>

            <!-- Nội dung câu hỏi -->
            <h2 id="question-title" class="text-lg sm:text-xl font-bold text-slate-100 mb-8 leading-relaxed">
                <!-- Nội dung được nạp qua JS -->
            </h2>

            <!-- Các ô chọn đáp án -->
            <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Nút đáp án nạp qua JS -->
            </div>
        </div>

        <!-- Thanh điều hướng câu hỏi -->
        <div class="flex justify-between items-center mt-6">
            <button id="prev-btn" onclick="changeQuestion(-1)" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed text-sm font-medium transition">
                ← Câu trước
            </button>
            <button id="next-btn" onclick="changeQuestion(1)" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium transition">
                Câu tiếp →
            </button>
        </div>

    </div>

    <script>
        // Dữ liệu bộ câu hỏi
        const quizData = [
            {
                grade: "Lớp 8",
                question: "Kết quả của hằng đẳng thức $(x + 3)^2$ là gì?",
                options: [
                    "A. $x^2 + 9$",
                    "B. $x^2 + 6x + 9$",
                    "C. $x^2 + 3x + 9$",
                    "D. $x^2 + 6x + 6$"
                ],
                correctIndex: 1
            },
            {
                grade: "Lớp 8",
                question: "Phân tích đa thức $x^2 - 4$ thành nhân tử:",
                options: [
                    "A. $(x - 2)^2$",
                    "B. $(x + 2)^2$",
                    "C. $(x - 2)(x + 2)$",
                    "D. $x(x - 4)$"
                ],
                correctIndex: 2
            },
            {
                grade: "Lớp 9",
                question: "Căn bậc hai số học của $16$ là:",
                options: [
                    "A. $4$",
                    "B. $-4$",
                    "C. $\\pm 4$",
                    "D. $256$"
                ],
                correctIndex: 0
            }
        ];

        let currentIndex = 0;

        function renderQuestion() {
            const currentQuiz = quizData[currentIndex];

            // Cập nhật thông tin text
            document.getElementById("grade-badge").innerText = currentQuiz.grade;
            document.getElementById("question-tracker").innerText = `Câu ${currentIndex + 1}/${quizData.length}`;
            document.getElementById("question-title").innerHTML = currentQuiz.question;

            // Cập nhật trạng thái nút
            document.getElementById("prev-btn").disabled = currentIndex === 0;
            document.getElementById("next-btn").innerText = currentIndex === quizData.length - 1 ? "Hoàn thành" : "Câu tiếp →";

            // Tạo các ô đáp án
            const container = document.getElementById("options-grid");
            container.innerHTML = "";

            currentQuiz.options.forEach((optText, idx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-4 rounded-xl bg-[#131b2e] hover:bg-[#1f2c48] border border-slate-700/80 hover:border-slate-500 transition duration-150 text-slate-200 font-medium cursor-pointer";
                btn.innerHTML = optText;
                
                btn.onclick = () => {
                    if (idx === currentQuiz.correctIndex) {
                        alert("Chính xác! 🎉");
                    } else {
                        alert("Chưa đúng, thử lại nhé!");
                    }
                };

                container.appendChild(btn);
            });

            // Gọi KaTeX để render toán sau khi chèn HTML xong
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        function changeQuestion(step) {
            currentIndex += step;
            if (currentIndex >= quizData.length) {
                alert("Bạn đã hoàn thành tất cả câu hỏi!");
                currentIndex = 0;
            }
            renderQuestion();
        }

        // Tải câu hỏi lần đầu tiên
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(renderQuestion, 50);
        });
    </script>
</body>
</html>
